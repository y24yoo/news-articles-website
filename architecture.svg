<svg viewBox="0 0 1200 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <title id="title">Architecture diagram — Economic Intelligence Platform after the Azure Foundry migration</title>
  <desc id="desc">backend/fred.py + backend/agents/ implement a Microsoft Agent Framework / Foundry multi-agent pipeline (IndicatorAgent, ResearchAgent, a direct run_economic_analysis tool call standing in for AnalysisAgent, and WriterAgent) backed by Azure AI Search and Daytona, with MongoDB removed and an EvaluationService instrumenting every stage. articles.py is a separate, unchanged legacy pipeline.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- ============ TITLE ============ -->
  <text x="600" y="34" text-anchor="middle" fill="#1a1a1a" font-size="24" font-weight="700">Economic Intelligence Platform — Architecture</text>
  <text x="600" y="56" text-anchor="middle" fill="#4b5563" font-size="13">Post Azure Foundry migration — all 8 phases in AGENTS.md merged to main (Microsoft Agent Framework + Foundry + Azure AI Search)</text>
  <text x="600" y="74" text-anchor="middle" fill="#9ca3af" font-size="11" font-style="italic">Not yet run against live Azure / FRED / Firecrawl credentials — built and unit-tested against fakes only</text>

  <!-- ============ SECTION 1: economic intelligence pipeline ============ -->
  <text x="40" y="106" fill="#1a1a1a" font-size="18" font-weight="600">1. Economic Intelligence Pipeline — backend/fred.py + backend/agents/</text>
  <line x1="40" y1="116" x2="1160" y2="116" stroke="#e5e7eb"/>

  <!-- FastAPI (planned, not built) -->
  <rect x="470" y="120" width="260" height="32" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="600" y="141" text-anchor="middle" fill="#6b7280" font-size="11" font-style="italic">User → FastAPI (mentioned in AGENTS.md, not yet built)</text>
  <line x1="600" y1="152" x2="600" y2="164" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="460" y="165" width="280" height="50" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="187" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Orchestrator</text>
  <text x="600" y="205" text-anchor="middle" fill="#6b7280" font-size="11">agents/orchestrator.py — run_report_pipeline(category)</text>

  <!-- Connector: orchestrator runs the 4 stages in sequence -->
  <line x1="600" y1="215" x2="600" y2="222" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="170" y1="222" x2="1040" y2="222" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="222" x2="170" y2="249" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="222" x2="460" y2="249" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="750" y1="222" x2="750" y2="249" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="222" x2="1040" y2="249" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="170" y="238" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="700">1</text>
  <text x="460" y="238" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="700">2</text>
  <text x="750" y="238" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="700">3</text>
  <text x="1040" y="238" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="700">4</text>

  <!-- Row B: 4-stage chain -->
  <!-- IndicatorAgent -->
  <rect x="40" y="250" width="260" height="100" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="275" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">IndicatorAgent</text>
  <text x="170" y="293" text-anchor="middle" fill="#6b7280" font-size="11">agents/indicator_agent.py</text>
  <text x="170" y="313" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">tools: search_fred_indicators,</text>
  <text x="170" y="327" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">get_fred_observations</text>
  <text x="170" y="343" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">selects + justifies indicators</text>

  <!-- ResearchAgent -->
  <rect x="330" y="250" width="260" height="100" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="275" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">ResearchAgent</text>
  <text x="460" y="293" text-anchor="middle" fill="#6b7280" font-size="11">agents/research_agent.py</text>
  <text x="460" y="313" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">tool: search_economic_documents</text>
  <text x="460" y="331" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">finds relevant research/news</text>
  <text x="460" y="345" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">(hybrid retrieval)</text>

  <!-- AnalysisAgent = direct tool call -->
  <rect x="620" y="250" width="260" height="100" rx="10" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="750" y="275" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">"AnalysisAgent"</text>
  <text x="750" y="293" text-anchor="middle" fill="#6b7280" font-size="11">fred.run_economic_analysis()</text>
  <text x="750" y="311" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">not a separate LLM agent —</text>
  <text x="750" y="325" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">called directly by the orchestrator</text>
  <text x="750" y="341" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">(Daytona's own agent does the work)</text>

  <!-- WriterAgent -->
  <rect x="910" y="250" width="260" height="100" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1040" y="275" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">WriterAgent</text>
  <text x="1040" y="293" text-anchor="middle" fill="#6b7280" font-size="11">agents/writer_agent.py</text>
  <text x="1040" y="313" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">no tools — pure synthesis</text>
  <text x="1040" y="331" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">combines indicators + research</text>
  <text x="1040" y="345" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">+ analysis into one report</text>

  <!-- horizontal arrows between the 4 stages -->
  <line x1="300" y1="300" x2="328" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="300" x2="618" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="300" x2="908" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row C: infra under each stage -->
  <line x1="170" y1="350" x2="170" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="40" y="380" width="260" height="90" rx="10" fill="#f9fafb" stroke="#10b981" stroke-width="1.5"/>
  <text x="170" y="402" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">FredService + Azure AI Search</text>
  <text x="170" y="420" text-anchor="middle" fill="#6b7280" font-size="10">FRED API (live observations)</text>
  <text x="170" y="436" text-anchor="middle" fill="#6b7280" font-size="10">fred-series index (semantic search)</text>
  <text x="170" y="452" text-anchor="middle" fill="#6b7280" font-size="10">fred-observations index (filter-only)</text>
  <text x="170" y="466" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">verified @search.rerankerScore field</text>

  <line x1="460" y1="350" x2="460" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="330" y="380" width="260" height="90" rx="10" fill="#f9fafb" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="402" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Azure AI Search</text>
  <text x="460" y="420" text-anchor="middle" fill="#6b7280" font-size="10">economic-documents index</text>
  <text x="460" y="436" text-anchor="middle" fill="#6b7280" font-size="10">keyword + vector (HNSW) + semantic</text>
  <text x="460" y="452" text-anchor="middle" fill="#6b7280" font-size="10">= hybrid retrieval</text>
  <text x="460" y="466" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">embeddings via FoundryEmbeddingClient</text>

  <line x1="750" y1="350" x2="750" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="620" y="380" width="260" height="90" rx="10" fill="#f9fafb" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="750" y="402" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Daytona Sandbox</text>
  <text x="750" y="420" text-anchor="middle" fill="#6b7280" font-size="10">DaytonaService.generate_economic_report()</text>
  <text x="750" y="436" text-anchor="middle" fill="#6b7280" font-size="10">runs a deepagents agent inside the sandbox</text>
  <text x="750" y="452" text-anchor="middle" fill="#6b7280" font-size="10">→ statistics + charts + report.html</text>
  <text x="750" y="466" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">one reusable fn, was 5 duplicated ones</text>

  <line x1="1040" y1="350" x2="1040" y2="379" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="910" y="380" width="260" height="90" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1040" y="405" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Final Economic Report</text>
  <text x="1040" y="425" text-anchor="middle" fill="#6b7280" font-size="10">combined text/HTML output of</text>
  <text x="1040" y="441" text-anchor="middle" fill="#6b7280" font-size="10">run_report_pipeline(category)</text>
  <text x="1040" y="459" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">printed by agents/orchestrator.py</text>

  <!-- Row D: Firecrawl ingestion + MongoDB removed -->
  <line x1="460" y1="500" x2="460" y2="479" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <rect x="330" y="500" width="260" height="55" rx="10" fill="#f9fafb" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="460" y="521" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">FirecrawlService</text>
  <text x="460" y="537" text-anchor="middle" fill="#6b7280" font-size="10">index_economic_news() —</text>
  <text x="460" y="550" text-anchor="middle" fill="#6b7280" font-size="10">search + scrape economic news → index</text>

  <rect x="40" y="500" width="260" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="170" y="521" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="600" text-decoration="line-through">MongoDB</text>
  <text x="170" y="538" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">removed (Phase 5) — pymongo /</text>
  <text x="170" y="551" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">MongoClient fully deleted from fred.py</text>

  <!-- Row E: EvaluationService banner -->
  <rect x="40" y="580" width="1130" height="72" rx="10" fill="#0ea5e9" fill-opacity="0.06" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="605" y="602" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">EvaluationService (Phase 8) — instruments every stage above, computed from real data, never fabricated</text>
  <text x="605" y="622" text-anchor="middle" fill="#6b7280" font-size="10.5">tool-call success rate + latency · report completion rate · HTML validation success rate</text>
  <text x="605" y="639" text-anchor="middle" fill="#6b7280" font-size="10.5">indicator selection accuracy (hallucination check) · retrieval relevance (@search.rerankerScore)</text>

  <!-- ============ SECTION 2: legacy articles.py pipeline ============ -->
  <text x="40" y="692" fill="#1a1a1a" font-size="18" font-weight="600">2. News Article Pipeline — backend/articles.py (unchanged, out of migration scope)</text>
  <line x1="40" y1="702" x2="1160" y2="702" stroke="#e5e7eb"/>

  <rect x="40" y="722" width="220" height="80" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="748" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Tech article agent</text>
  <text x="150" y="766" text-anchor="middle" fill="#6b7280" font-size="10">LangChain agent + its own</text>
  <text x="150" y="780" text-anchor="middle" fill="#6b7280" font-size="10">Firecrawl @tool (search+scrape)</text>
  <text x="150" y="796" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">enforces HTML output</text>

  <rect x="300" y="722" width="220" height="80" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="748" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Politics article agent</text>
  <text x="410" y="766" text-anchor="middle" fill="#6b7280" font-size="10">LangChain agent + its own</text>
  <text x="410" y="780" text-anchor="middle" fill="#6b7280" font-size="10">Firecrawl @tool (search+scrape)</text>
  <text x="410" y="796" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">enforces HTML output</text>

  <rect x="560" y="722" width="220" height="80" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="670" y="748" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Economics article agent</text>
  <text x="670" y="766" text-anchor="middle" fill="#6b7280" font-size="10">LangChain agent + its own</text>
  <text x="670" y="780" text-anchor="middle" fill="#6b7280" font-size="10">Firecrawl @tool (search+scrape)</text>
  <text x="670" y="796" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">enforces HTML output</text>

  <line x1="260" y1="762" x2="878" y2="770" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="762" x2="878" y2="775" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="780" y1="762" x2="878" y2="780" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="880" y="732" width="280" height="80" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1020" y="756" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">frontend/news/articles/</text>
  <text x="1020" y="774" text-anchor="middle" fill="#6b7280" font-size="10">{tech,politics,economy}/report.html</text>
  <text x="1020" y="792" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">saved as static HTML files</text>

  <rect x="40" y="830" width="1120" height="72" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="852" fill="#b91c1c" font-size="11" font-weight="600">Note (discovered during Phase 6, not fixed — articles.py is out of this migration's scope):</text>
  <text x="60" y="870" fill="#7f1d1d" font-size="10.5">firecrawl-py 4.42+'s top-level Firecrawl/AsyncFirecrawl classes dropped general web search/scrape entirely (pivoted to</text>
  <text x="60" y="886" fill="#7f1d1d" font-size="10.5">academic-paper/GitHub search). articles.py's firecrawl.search()/scrape() calls almost certainly no longer work as written.</text>

  <!-- ============ END-TO-END FLOW LEGEND ============ -->
  <text x="40" y="944" fill="#1a1a1a" font-size="18" font-weight="600">End-to-end flow (economic intelligence pipeline)</text>
  <line x1="40" y1="954" x2="1160" y2="954" stroke="#e5e7eb"/>

  <g>
    <circle cx="60" cy="984" r="12" fill="#3b82f6"/>
    <text x="60" y="989" text-anchor="middle" fill="white" font-size="12" font-weight="700">1</text>
    <text x="84" y="989" fill="#4b5563" font-size="12">IndicatorAgent ingests a category's FRED series into Azure AI Search (fred-series), then selects and justifies the best indicators.</text>
  </g>
  <g>
    <circle cx="60" cy="1016" r="12" fill="#3b82f6"/>
    <text x="60" y="1021" text-anchor="middle" fill="white" font-size="12" font-weight="700">2</text>
    <text x="84" y="1021" fill="#4b5563" font-size="12">Selected indicators' observations are fetched live from FRED and indexed into fred-observations.</text>
  </g>
  <g>
    <circle cx="60" cy="1048" r="12" fill="#3b82f6"/>
    <text x="60" y="1053" text-anchor="middle" fill="white" font-size="12" font-weight="700">3</text>
    <text x="84" y="1053" fill="#4b5563" font-size="12">ResearchAgent runs a hybrid (keyword + vector + semantic) search over economic-documents for relevant research/news.</text>
  </g>
  <g>
    <circle cx="60" cy="1080" r="12" fill="#8b5cf6"/>
    <text x="60" y="1085" text-anchor="middle" fill="white" font-size="12" font-weight="700">4</text>
    <text x="84" y="1085" fill="#4b5563" font-size="12">run_economic_analysis() joins indicator data + observations and hands it to a Daytona sandbox, which produces report.html + charts.</text>
  </g>
  <g>
    <circle cx="60" cy="1112" r="12" fill="#3b82f6"/>
    <text x="60" y="1117" text-anchor="middle" fill="white" font-size="12" font-weight="700">5</text>
    <text x="84" y="1117" fill="#4b5563" font-size="12">WriterAgent combines the indicator selection, research findings, and analysis report into one final economic report.</text>
  </g>
  <g>
    <circle cx="60" cy="1144" r="12" fill="#0ea5e9"/>
    <text x="60" y="1149" text-anchor="middle" fill="white" font-size="12" font-weight="700">6</text>
    <text x="84" y="1149" fill="#4b5563" font-size="12">EvaluationService records outcomes throughout — tool-call success/latency, selection validity, report completion, HTML format, retrieval relevance.</text>
  </g>
</svg>
